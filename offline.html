<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#151837">
  <title>Hors ligne | Détente & Loisirs à Assinie</title>
  <!-- Page servie par sw.js quand aucune connexion n'est disponible et que la
       page demandée n'a jamais été ouverte. Autonome : aucun fichier externe. -->
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; padding: 2rem;
      box-sizing: border-box; background: #151837; color: #fff; text-align: center;
      font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 26rem; }
    img { width: 96px; height: 96px; border-radius: 22px; background: #fff; padding: 6px; box-sizing: border-box; }
    h1 { margin: 1.4rem 0 .6rem; font: 700 1.6rem/1.2 Georgia, "Times New Roman", serif; }
    p { margin: 0 0 1.4rem; color: rgba(255, 255, 255, .75); }
    .actions { display: grid; gap: .7rem; }
    button, a { display: block; padding: .9rem 1.2rem; border-radius: 999px; font: 700 .95rem/1 system-ui, sans-serif; text-decoration: none; border: 0; cursor: pointer; }
    button { background: #e8b904; color: #151837; }
    a { background: transparent; color: #fff; border: 1px solid rgba(255, 255, 255, .35); }
  </style>
</head>
<body>
  <main>
    <img src="/assets/app/icon-192.png" alt="Détente & Loisirs à Assinie">
    <h1>Vous êtes hors ligne</h1>
    <p>La page demandée n’a pas pu être chargée. Vérifiez votre connexion, puis réessayez. Notre conciergerie reste joignable par téléphone.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Réessayer</button>
      <a href="tel:+2250767696318">Appeler le +225 07 67 69 63 18</a>
    </div>
  </main>
</body>
</html>
